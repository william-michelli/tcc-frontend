<div class="login-container">
  <!-- Card do usuário -->
  <div class="user-card" *ngIf="user.google">
    <img [src]="user.google.picture" alt="Foto" class="user-photo">
    <div class="user-info">
      <p class="user-name">Olá, {{ user.google.name }}</p>
      <p class="user-email">{{ user.google.email }}</p>
    </div>

    <button class="register-btn" (click)="newJob()">Nova Vaga</button>
    <button class="register-btn" (click)="enterProfile()">Perfil</button>
    <button class="logout-btn" (click)="logout()">Sair</button>
  </div>
</div>
